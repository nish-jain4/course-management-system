    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
 <div class="container">
    <div class="header">
        <div class="login-header">
                <div class="neu-icon">
                   <svg xmlns="http://www.w3.org/2000/svg" width="100px" height="150px" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
  <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
</svg>
                </div>
            </div>
        </div>
            <h1 class="title">Register Page</h1>
            <p class="subtitle">New Here? Create a new account</p>
            <div class="form-container">
         <form method="POST" action="{{ url_for('register') }}" id="registrationForm">
                    <div class ="form-group">
                    <label for="username" class="form-label">Full Name</label>
                     <input type="text" id="username" name="username" class="form-input" placeholder="Enter your full name" required>
                   </div>           
            
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    
                        <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>

                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    
                        <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required>
                </div>

                <!-- Terms and Conditions 
                <div class="terms-group">
                    <div class="checkbox-container">
                        <input type="checkbox" id="terms" class="checkbox-input" required>
                        <span class="checkbox-custom"></span>
                    </div>
                    <label for="terms" class="checkbox-label">
                        I agree to the <a href="#" tabindex="-1">Terms of Service</a> and <a href="#" tabindex="-1">Privacy Policy</a>
                    </label>
                </div>
            -->
                <div class="button-container">
                    <button type="submit" class="submit-btn" id="submitBtn">
                       <span>Create Account</span>
                    </button>
                </div>

                <div class="login-link">
                    Already have an account? <a href="{{ url_for('login') }}">Log In</a>
                </div>
                </form>
            </div>  
            
        </div>

          
</body> 
</html>
